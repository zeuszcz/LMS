name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install deps
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app
        continue-on-error: true  # promote to required after stabilization

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing
        env:
          JWT_SECRET: test_secret_with_at_least_32_characters_xx
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true  # promote to required after stabilization

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

  wiki-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check concept count cap
        run: |
          count=$(find secondbrain/knowledge/concepts -maxdepth 1 -name '*.md' | wc -l)
          echo "Concepts: $count"
          if [ "$count" -gt 45 ]; then
            echo "::error::Concept ceiling (45) exceeded — consolidate or use connections."
            exit 1
          fi

      - name: Check log freshness
        run: |
          if [ -s secondbrain/knowledge/log.md ]; then
            echo "log.md present"
          else
            echo "::warning::secondbrain/knowledge/log.md is empty"
          fi
